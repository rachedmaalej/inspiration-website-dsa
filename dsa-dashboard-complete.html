<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domaine Sidi Abdallah — Tableau de bord projet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,300,0,0&display=swap" rel="stylesheet">

<style>
  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined';
    font-weight: normal; font-style: normal; font-size: 20px;
    line-height: 1; letter-spacing: normal; text-transform: none;
    display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr;
    -webkit-font-feature-settings: 'liga'; font-feature-settings: 'liga';
    -webkit-font-smoothing: antialiased; vertical-align: middle;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #FAF6EF;
    --surface:  #FFFFFF;
    --ink:      #3A3020;
    --ink2:     #5A4D3C;
    --muted:    #A89880;
    --dim:      #C8BCAA;
    --border:   #EDE5D8;
    --border2:  #DDD5C8;
    --card-bg:  #FFFFFF;
    --field-bg: #F5EFE6;
    --grove:    #4A6741;
    --gold:     #C4A35A;
    --sage:     #5C7A6B;
    --terra:    #B5623A;
    --taupe:    #8B7355;
    --amber:    #A0876A;
    --teal:     #4A7060;
    --radius:   16px;
    --radius-sm:12px;
    --radius-xs:10px;
    --shadow-sm: 0 1px 4px rgba(58,48,32,0.04);
    --shadow:    0 2px 12px rgba(58,48,32,0.06);
    --shadow-lg: 0 8px 32px rgba(58,48,32,0.10);
    --font-disp: 'Instrument Serif', Georgia, serif;
    --font-body: 'DM Sans', system-ui, sans-serif;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-weight: 400;
    font-size: 14px;
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* ── SCROLL PROGRESS ── */
  .scroll-progress {
    position: fixed; top: 0; left: 0; height: 3px;
    background: linear-gradient(to right, var(--grove), var(--gold));
    z-index: 200; pointer-events: none; transition: width 0.1s linear;
    border-radius: 0 2px 2px 0;
  }

  /* ── HEADER ── */
  .header {
    background: linear-gradient(135deg, #F5EDE0 0%, #FAF6EF 60%, #EDE8DD 100%);
    border-bottom: 1px solid var(--border);
    padding: 0 48px;
    display: flex; align-items: stretch; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .header-brand { display: flex; align-items: center; gap: 16px; padding: 18px 0; }
  .header-icon { width: 36px; height: 36px; background: #E6EDE2; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--grove); flex-shrink: 0; }
  .header-title { font-family: var(--font-disp); font-size: 20px; color: var(--ink); }
  .header-title em { font-style: italic; color: var(--grove); }
  .header-sub { font-family: var(--font-body); font-weight: 400; font-size: 11px; color: var(--muted); margin-top: 1px; }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .header-status { font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .header-status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--grove); display: inline-block; box-shadow: 0 0 0 3px #E6EDE2; }

  /* ── NAV ── */
  .nav {
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 0 48px;
    display: flex; overflow-x: auto; gap: 4px;
  }
  .nav-tab {
    padding: 14px 20px;
    font-family: var(--font-body); font-weight: 400; font-size: 13px;
    color: var(--muted); border: none; background: none; cursor: pointer;
    border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap;
    border-radius: 12px 12px 0 0;
  }
  .nav-tab:hover { color: var(--ink2); background: rgba(237,229,216,0.4); }
  .nav-tab.active { color: var(--grove); border-bottom-color: var(--gold); font-weight: 500; }

  .main { padding: 48px; max-width: 1440px; margin: 0 auto; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ── PAGE HEADER (Organic greeting) ── */
  .page-header { margin-bottom: 32px; }
  .page-greeting {
    font-family: var(--font-disp); font-size: 36px; font-style: italic; color: var(--ink);
    line-height: 1.2; margin-bottom: 4px;
  }
  .page-greeting-accent { color: var(--grove); }
  .page-sub { font-family: var(--font-body); font-weight: 400; font-size: 13px; color: var(--muted); }

  /* ── CARDS (Organic: 16px radius, warm border) ── */
  .card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); position: relative; overflow: hidden;
    transition: box-shadow 0.25s, transform 0.25s;
  }
  .card:hover { box-shadow: var(--shadow-lg); }
  .card-p { padding: 24px; }
  .card-p-sm { padding: 16px 20px; }

  /* ── VITAL CARDS (stat cards with bottom accent) ── */
  .vital-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
  .vital {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 24px; position: relative; overflow: hidden;
    box-shadow: var(--shadow); transition: box-shadow 0.25s, transform 0.25s;
  }
  .vital:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
  .vital-accent { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; border-radius: 0 0 16px 16px; }
  .vital-icon { width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
  .vital-val { font-family: var(--font-disp); font-size: 32px; color: var(--ink); line-height: 1; margin-bottom: 4px; }
  .vital-label { font-family: var(--font-body); font-weight: 400; font-size: 13px; color: var(--muted); }

  /* ── SECTION TITLE ── */
  .section-title {
    font-family: var(--font-body); font-weight: 500; font-size: 15px;
    color: var(--ink); margin-bottom: 18px; display: flex; align-items: center; gap: 10px;
  }
  .section-title .material-symbols-outlined { font-size: 18px; color: var(--muted); }

  /* ── CARD TITLE (inside cards) ── */
  .card-title {
    font-family: var(--font-body); font-weight: 500; font-size: 15px;
    color: var(--ink); margin-bottom: 18px;
  }

  /* ── PHASE BARS (Organic: dots + 6px bars) ── */
  .phase-block { margin-bottom: 16px; }
  .phase-row { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .phase-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .phase-info { flex: 1; }
  .phase-name { font-family: var(--font-body); font-size: 14px; font-weight: 500; color: var(--ink); }
  .phase-dates { font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .phase-track { height: 6px; background: #EDE5D8; border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .phase-fill  { height: 100%; border-radius: 3px; transition: width 0.8s cubic-bezier(.4,0,.2,1); }

  /* ── DEADLINE ITEMS (Organic: icon circle + text + date) ── */
  .dl-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .dl-item:last-child { border-bottom: none; }
  .dl-icon { width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .dl-icon .material-symbols-outlined { font-size: 18px; }
  .dl-body { flex: 1; }
  .dl-title { font-family: var(--font-body); font-size: 14px; font-weight: 500; color: var(--ink); }
  .dl-meta { font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--muted); }
  .dl-date { font-family: var(--font-body); font-weight: 500; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .dl-date-warn { color: var(--terra); }

  /* ── BUDGET PILLS (Organic: rounded with top stripe) ── */
  .budget-pills { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .budget-pill {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 20px; position: relative; overflow: hidden; box-shadow: var(--shadow-sm);
    transition: box-shadow 0.25s, transform 0.25s;
  }
  .budget-pill:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
  .budget-pill-stripe { position: absolute; top: 0; left: 0; right: 0; height: 3px; border-radius: 12px 12px 0 0; }
  .budget-pill-name { font-family: var(--font-body); font-weight: 400; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .budget-pill-val { font-family: var(--font-disp); font-size: 22px; color: var(--ink); }

  /* ── BADGES ── */
  .badge {
    display: inline-flex; align-items: center; padding: 3px 10px;
    border-radius: 20px; font-family: var(--font-body); font-weight: 500;
    font-size: 11px; white-space: nowrap; border: 1px solid transparent;
  }

  /* ── KANBAN ── */
  .kanban { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; align-items: start; }
  .k-col { border-radius: var(--radius); padding: 14px; border: 1px solid var(--border); background: #F5EFE6; }
  .k-col-header {
    font-family: var(--font-body); font-weight: 500; font-size: 13px;
    color: var(--muted); margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center;
  }
  .k-count { background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; }
  .task-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 14px 16px; margin-bottom: 10px; cursor: pointer;
    transition: box-shadow 0.2s, transform 0.2s, border-color 0.2s; box-shadow: var(--shadow-sm);
  }
  .task-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); border-color: var(--gold); }
  .task-card:last-child { margin-bottom: 0; }
  .task-title { font-size: 13px; font-weight: 500; color: var(--ink); line-height: 1.5; margin-bottom: 10px; }
  .task-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .task-due { font-family: var(--font-body); font-weight: 400; font-size: 11px; color: var(--muted); }
  .task-overdue { color: var(--terra); font-weight: 600; }
  .task-block-tag { font-family: var(--font-body); font-weight: 400; font-size: 11px; color: var(--dim); }
  .task-comments-indicator { font-family: var(--font-body); font-weight: 400; font-size: 11px; color: var(--muted); margin-top: 6px; display: flex; align-items: center; gap: 4px; }

  /* ── FILTERS ── */
  .filter-bar { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; align-items: center; }
  .filter-label { font-family: var(--font-body); font-weight: 500; font-size: 12px; color: var(--muted); }
  .filter-btn {
    padding: 6px 16px; border-radius: 20px;
    font-family: var(--font-body); font-weight: 500; font-size: 12px;
    cursor: pointer; border: 1px solid var(--border);
    background: var(--surface); color: var(--muted); transition: all 0.18s;
  }
  .filter-btn:hover { border-color: var(--muted); color: var(--ink2); }
  .filter-btn.active { background: var(--grove); border-color: var(--grove); color: #fff; }

  /* ── DECISIONS TABLE ── */
  .dec-table { width: 100%; border-collapse: collapse; }
  .dec-table th {
    font-family: var(--font-body); font-weight: 500; font-size: 12px;
    color: var(--muted); padding: 12px 18px; text-align: left;
    border-bottom: 1px solid var(--border);
  }
  .dec-table td { padding: 16px 18px; border-bottom: 1px solid var(--border); font-size: 14px; font-weight: 400; vertical-align: top; }
  .dec-table tr:last-child td { border-bottom: none; }
  .dec-table tbody tr:hover td { background: #F5EFE6; cursor: pointer; }

  /* ── DEPENDENCIES ── */
  .dep-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .dep-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 24px; box-shadow: var(--shadow); transition: box-shadow 0.25s, transform 0.25s;
  }
  .dep-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
  .dep-card-title { font-family: var(--font-disp); font-size: 18px; color: var(--ink); margin-bottom: 4px; }
  .dep-card-owner { font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--muted); margin-bottom: 18px; }
  .dep-item { display: flex; justify-content: space-between; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--border); gap: 10px; }
  .dep-item:last-child { border-bottom: none; }
  .dep-item-name { font-size: 13px; font-weight: 500; color: var(--ink2); line-height: 1.5; }
  .dep-item-note { font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* ── BUDGET (full tab) ── */
  .budget-section { margin-bottom: 24px; }
  .budget-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .budget-name { font-family: var(--font-disp); font-size: 20px; color: var(--ink); display: flex; align-items: center; gap: 12px; }
  .budget-stripe { width: 4px; height: 24px; border-radius: 2px; flex-shrink: 0; }
  .budget-track { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 14px; }
  .budget-fill  { height: 100%; border-radius: 3px; transition: width 0.7s; }
  .budget-entry { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-radius: var(--radius-sm); margin-bottom: 6px; }
  .budget-entry-left { flex: 1; }
  .budget-entry-name { font-size: 13px; font-weight: 500; color: var(--ink); }
  .budget-entry-meta { font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* ── TIMELINE ── */
  .tl-wrap { overflow-x: auto; }
  .tl-grid { display: grid; grid-template-columns: 190px repeat(12, 1fr); min-width: 760px; }
  .tl-hcell { font-family: var(--font-body); font-weight: 500; font-size: 11px; color: var(--muted); text-align: center; padding: 8px 4px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); }
  .tl-hcell.current { color: var(--grove); background: rgba(74,103,65,0.06); font-weight: 600; }
  .tl-label { font-family: var(--font-body); font-weight: 500; font-size: 12px; color: var(--ink2); text-align: right; padding: 4px 12px 4px 0; display: flex; align-items: center; justify-content: flex-end; border-right: 1px solid var(--border); min-height: 28px; }
  .tl-cell { border-right: 1px solid var(--border); height: 28px; display: flex; align-items: center; }
  .tl-bar { height: 16px; width: 100%; border-radius: 4px; opacity: 0.85; }
  .milestone-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 24px; }
  .milestone-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 16px 18px; box-shadow: var(--shadow-sm);
    transition: box-shadow 0.2s, transform 0.2s;
  }
  .milestone-card:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
  .milestone-date { font-family: var(--font-body); font-weight: 500; font-size: 12px; color: var(--gold); margin-bottom: 4px; }
  .milestone-label { font-family: var(--font-disp); font-size: 15px; color: var(--ink); line-height: 1.4; }

  /* ── LILIA VIEW ── */
  .lilia-section { margin-bottom: 16px; }
  .lilia-section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .lilia-section-num { font-family: var(--font-body); font-size: 11px; font-weight: 500; color: var(--muted); background: var(--field-bg); padding: 3px 10px; border-radius: 20px; }
  .lilia-section-title { font-family: var(--font-disp); font-size: 18px; color: var(--ink); }
  .lilia-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--border); gap: 16px; }
  .lilia-row:last-child { border-bottom: none; }

  /* ── LEGEND ── */
  .legend { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: rgba(237,229,216,0.4); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 16px; margin-bottom: 28px; }
  .legend-group { display: flex; align-items: center; gap: 8px; }
  .legend-title { font-family: var(--font-body); font-weight: 500; font-size: 11px; color: var(--muted); white-space: nowrap; margin-right: 4px; }
  .legend-chip { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-body); font-weight: 400; font-size: 11px; color: var(--ink2); white-space: nowrap; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
  .legend-bar { width: 16px; height: 6px; border-radius: 3px; flex-shrink: 0; display: inline-block; }

  /* ── FORMS & BUTTONS ── */
  .btn {
    padding: 10px 24px; border-radius: var(--radius-sm);
    font-family: var(--font-body); font-weight: 500; font-size: 13px;
    cursor: pointer; border: 1px solid transparent; transition: all 0.18s;
  }
  .btn-primary { background: var(--grove); color: #F7F3EC; border-color: var(--grove); }
  .btn-primary:hover { background: #3A5635; }
  .btn-ghost { background: transparent; color: var(--muted); border-color: var(--border); }
  .btn-ghost:hover { color: var(--ink2); border-color: var(--muted); }
  .btn-danger { background: transparent; color: var(--terra); border-color: #E8C0A8; }
  .btn-danger:hover { background: #F8EDE6; }
  .btn-sm { padding: 6px 16px; font-size: 12px; }
  input, select, textarea {
    background: var(--field-bg); border: 1px solid var(--border);
    color: var(--ink); padding: 10px 14px; border-radius: var(--radius-xs);
    font-family: var(--font-body); font-weight: 400; font-size: 14px;
    outline: none; width: 100%; transition: border-color 0.18s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--gold); background: #fff; }
  select option { background: #fff; }
  label {
    font-family: var(--font-body); font-weight: 500; font-size: 12px;
    color: var(--muted); display: block; margin-bottom: 6px;
  }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .form-field { margin-bottom: 14px; }

  /* ── MODAL ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(58,48,32,0.35); display: flex; align-items: center; justify-content: center; z-index: 200; backdrop-filter: blur(4px); }
  .modal { background: var(--surface); border-radius: var(--radius); padding: 36px; width: 560px; max-width: 96vw; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); border: 1px solid var(--border); }
  .modal-title { font-family: var(--font-disp); font-size: 24px; margin-bottom: 24px; color: var(--ink); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border); }

  /* ── COMMENTS ── */
  .comments-section { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); }
  .comments-label { font-family: var(--font-body); font-weight: 500; font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .comment-item { background: var(--field-bg); border-radius: var(--radius-xs); padding: 10px 14px; margin-bottom: 8px; }
  .comment-meta { font-family: var(--font-body); font-weight: 400; font-size: 11px; color: var(--muted); margin-bottom: 4px; display: flex; gap: 8px; }
  .comment-text { font-size: 13px; font-weight: 400; color: var(--ink2); line-height: 1.55; }

  /* ── GRIDS ── */
  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

  /* ── FOOTER ── */
  .site-footer {
    text-align: center; padding: 36px 48px; border-top: 1px solid var(--border);
    font-family: var(--font-body); font-weight: 400; font-size: 12px;
    color: var(--muted);
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 1100px) { .kanban { grid-template-columns: repeat(3,1fr); } .vital-grid,.budget-pills { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 800px) { .main { padding: 24px; } .header,.nav { padding-left: 24px; padding-right: 24px; } .kanban { grid-template-columns: 1fr 1fr; } .dep-grid,.g2,.g3,.milestone-grid { grid-template-columns: 1fr; } .form-row { grid-template-columns: 1fr; } }
  @media (max-width: 560px) { .kanban { grid-template-columns: 1fr; } .vital-grid,.budget-pills { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>

<div class="scroll-progress" id="scrollProgress" style="width:0%"></div>

<!-- HEADER -->
<header class="header">
  <div class="header-brand">

function save() {
  try {

    localStorage.setItem("dsa-decisions", JSON.stringify(decisions));
  } catch(e) {}
}
function load() {
  try {
    const t = localStorage.getItem("dsa-tasks"); if(t) tasks = JSON.parse(t);
    const b = localStorage.getItem("dsa-budget"); if(b) budget = JSON.parse(b);
    const d = localStorage.getItem("dsa-decisions"); if(d) decisions = JSON.parse(d);
  } catch(e) {}
}

let activeTab = "dashboard";

document.getElementById("navTabs").addEventListener("click", e => {
  const btn = e.target.closest(".nav-tab");
  if (!btn) return;
  activeTab = btn.dataset.tab;
  document.querySelectorAll(".nav-tab").forEach(t => t.classList.toggle("active", t.dataset.tab === activeTab));
  document.querySelectorAll(".tab-content").forEach(t => t.classList.toggle("active", t.id === "tab-" + activeTab));
  renderTab(activeTab);
  window.scrollTo({top: 0});
});

// =============================================================================
function renderTab(tab) {
  const el = document.getElementById("tab-" + tab);
  if (!el) return;
  const renderers = { dashboard: renderDashboard, tasks: renderTasks, timeline: renderTimeline, budget: renderBudget, decisions: renderDecisions, deps: renderDeps, lilia: renderLilia };
  if (renderers[tab]) el.innerHTML = renderers[tab]();
}

      openD.map(d=>`<div style="display:flex;justify-content:space-between;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--border);gap:20px">
        <div style="flex:1">
          <div style="font-size:14px;color:var(--ink);margin-bottom:4px;line-height:1.5;font-weight:500">${esc(d.decision)}</div>
          ${d.context?`<div style="font-size:13px;color:var(--muted);font-style:italic">${esc(d.context)}</div>`:""}
          <div style="font-size:12px;color:var(--dim);margin-top:4px">D\u00e9cid\u00e9 par: ${esc(d.by)}</div>
        </div>
        ${decStatusBadge(d.status)}
      </div>`).join("")
    )}

    ${sectionWrap(2, "D\u00e9penses importantes \u00e0 approuver", C.bDigital.hex,
      bigExpenses.length === 0 ? `<div style="font-size:13px;color:var(--muted);font-style:italic">Aucune d\u00e9pense \u2265 10 000 TND.</div>` :
      bigExpenses.map(e=>{
        const sc=e.status==="pay\u00e9"?C.bPaye:e.status==="engag\u00e9"?C.bEngage:C.bPrevu;
        return `<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-radius:var(--radius-sm);background:${sc.bg};margin-bottom:8px;gap:16px">
          <div style="flex:1"><div style="font-size:14px;color:var(--ink);font-weight:500;margin-bottom:2px">${esc(e.name)}</div>${e.date?`<div style="font-size:12px;color:var(--muted)">Pr\u00e9vu: ${fmtDate(e.date)}</div>`:""}</div>
          <div style="text-align:right;flex-shrink:0"><div style="font-family:var(--font-disp);font-size:20px;color:${sc.text}">${e.amount.toLocaleString()}</div><div style="font-size:11px;color:var(--muted)">TND</div></div>
          <span class="badge" style="background:${sc.bg};color:${sc.text};border-color:${sc.border||'transparent'};flex-shrink:0">${e.status}</span>
        </div>`;
      }).join("") +
      `<div style="margin-top:16px;padding:14px 18px;background:var(--field-bg);border-radius:var(--radius-sm);display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:13px;color:var(--muted)">Total budget allou\u00e9</span>
        <span style="font-family:var(--font-disp);font-size:22px;color:var(--grove)">${totalBudget.toLocaleString()} <span style="font-size:13px;color:var(--muted)">TND</span></span>
      </div>`
    )}

    ${sectionWrap(3, "Avancement du projet par phase", C.phase1.hex,
      PHASES.map(p=>{
        const pT=tasks.filter(t=>t.phase===p.id); const pD=pT.filter(t=>t.status==="done").length;
        const pct=pT.length?Math.round(pD/pT.length*100):0;
        const pB=pT.filter(t=>t.status==="blocked").length;
        return `<div class="phase-block">
          <div class="phase-row">
            <div class="phase-dot" style="background:${p.color}"></div>
            <div class="phase-info">
              <div class="phase-name">${p.label}</div>
              <div class="phase-dates">${pB>0?`<span style="color:var(--terra);margin-right:8px">\u26a0 ${pB} bloqu\u00e9e${pB>1?"s":""}</span>`:""}${pD}/${pT.length} \u00b7 ${p.dates}</div>
            </div>
          </div>
          <div class="phase-track" style="margin-left:22px"><div class="phase-fill" style="width:${pct}%;background:${p.color}"></div></div>
        </div>`;
      }).join("") +
      (active.length>0?`<div style="margin-top:18px;padding-top:18px;border-top:1px solid var(--border)">
        <div style="font-size:13px;color:var(--muted);font-weight:500;margin-bottom:12px">En cours & bloqu\u00e9es</div>
        ${active.map(t=>`<div class="lilia-row">
          <div style="flex:1"><div style="font-size:14px;margin-bottom:6px;font-weight:500">${esc(t.title)}</div><div style="display:flex;gap:8px">${ownerBadge(t.owner)}${statusBadge(t.status)}</div></div>
          ${t.due?`<div style="font-size:12px;color:${isOverdue(t.due)?'var(--terra)':'var(--muted)'};white-space:nowrap">${fmtDate(t.due)}</div>`:""}
        </div>`).join("")}
      </div>`:"")
    )}

    ${sectionWrap(4, "Prochains jalons", C.phase3.hex,
      `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
        ${milestoneData.map(m=>{
          const p=PHASES.find(ph=>ph.id===m.phase);
          return `<div style="background:var(--field-bg);border-radius:var(--radius-sm);padding:14px 16px;border-left:3px solid ${p?.color||'var(--border)'}">
            <div style="font-size:12px;color:${p?.color||'var(--muted)'};margin-bottom:4px;font-weight:500">${m.date}</div>
            <div style="font-family:var(--font-disp);font-size:14px;color:var(--ink);line-height:1.4">${m.label}</div>
          </div>`;
        }).join("")}
      </div>`
    )}`;
}

// =============================================================================
// MODALS
// =============================================================================
function closeModal() { document.getElementById("modalContainer").innerHTML = ""; }

function openTaskModal(id) {
  const task = id ? tasks.find(t=>t.id===id) : null;
  const f = task || {title:"",phase:"0",status:"todo",owner:"R",due:"",block:"",notes:"",comments:[]};
  document.getElementById("modalContainer").innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-title">${task?"Modifier la t\u00e2che":"Nouvelle t\u00e2che"}</div>
        <div class="form-field"><label>Titre</label><input id="mTitle" value="${esc(f.title)}"></div>
        <div class="form-row">
          <div><label>Phase</label><select id="mPhase">${PHASES.map(p=>`<option value="${p.id}" ${f.phase===p.id?"selected":""}>${p.id} \u2014 ${p.label.split("\u2014")[1]?.trim()||p.label}</option>`).join("")}</select></div>
          <div><label>Statut</label><select id="mStatus">
            <option value="todo" ${f.status==="todo"?"selected":""}>\u00c0 faire</option>
            <option value="in-progress" ${f.status==="in-progress"?"selected":""}>En cours</option>
            <option value="review" ${f.status==="review"?"selected":""}>En revue</option>
            <option value="done" ${f.status==="done"?"selected":""}>Fait \u2713</option>
            <option value="blocked" ${f.status==="blocked"?"selected":""}>Bloqu\u00e9e</option>
          </select></div>
        </div>
        <div class="form-row">
          <div><label>Responsable</label><select id="mOwner">
            <option value="R" ${f.owner==="R"?"selected":""}>Rached</option>
            <option value="E" ${f.owner==="E"?"selected":""}>Elyssa</option>
            <option value="L" ${f.owner==="L"?"selected":""}>Lilia</option>
            <option value="ALL" ${f.owner==="ALL"?"selected":""}>Tous</option>
          </select></div>
          <div><label>\u00c9ch\u00e9ance</label><input id="mDue" type="date" value="${f.due}"></div>
        </div>
        <div class="form-row"><div><label>Bloc</label><input id="mBlock" value="${esc(f.block)}" placeholder="ex: D\u00e9veloppement"></div></div>
        <div class="form-field"><label>Notes</label><textarea id="mNotes" rows="2">${esc(f.notes)}</textarea></div>
        <div class="comments-section">
          <div class="comments-label">Mises \u00e0 jour (${(f.comments||[]).length})</div>
          <div id="commentsList">
            ${(f.comments||[]).map(c=>`<div class="comment-item"><div class="comment-meta"><span>${fmtTS(c.ts)}</span><button onclick="deleteComment(${task?task.id:0},${c.id})" style="margin-left:auto;background:none;border:none;color:var(--terra);cursor:pointer;font-size:12px">suppr.</button></div><div class="comment-text">${esc(c.text)}</div></div>`).join("")}
          </div>
          <div style="display:flex;gap:8px;margin-top:10px">
            <textarea id="mNewComment" rows="2" placeholder="Ajouter une mise \u00e0 jour\u2026" style="flex:1;resize:none;font-size:13px"></textarea>
            <button class="btn btn-ghost btn-sm" style="white-space:nowrap;align-self:flex-end" onclick="addCommentToModal(${task?task.id:0})"><span class="material-symbols-outlined" style="font-size:14px;vertical-align:-2px">add</span> Ajouter</button>
          </div>
        </div>
        <div class="modal-actions">
          ${task?`<button class="btn btn-danger btn-sm" onclick="deleteTask(${task.id})">Supprimer</button>`:""}
          <button class="btn btn-ghost btn-sm" onclick="closeModal()">Annuler</button>
          <button class="btn btn-primary btn-sm" onclick="saveTask(${task?task.id:0})">Enregistrer</button>
        </div>
      </div>
    </div>`;
}

function addCommentToModal(taskId) {
  const el = document.getElementById("mNewComment");
  if (!el.value.trim()) return;
  if (taskId) {
    const t = tasks.find(t=>t.id===taskId);
    if (t) { t.comments = t.comments||[]; t.comments.push({id:Date.now(),text:el.value.trim(),ts:new Date().toISOString()}); save(); }
  }
  openTaskModal(taskId || 0);
}

function deleteComment(taskId, commentId) {
  const t = tasks.find(t=>t.id===taskId);
  if (t) { t.comments = (t.comments||[]).filter(c=>c.id!==commentId); save(); }
  openTaskModal(taskId);
}

function saveTask(id) {
  const title = document.getElementById("mTitle").value;
  if (!title) return;
  const data = {
    title, phase: document.getElementById("mPhase").value,
    status: document.getElementById("mStatus").value,
    owner: document.getElementById("mOwner").value,
    due: document.getElementById("mDue").value,
    block: document.getElementById("mBlock").value,
    notes: document.getElementById("mNotes").value,
  };
  if (id) {
    const t = tasks.find(t=>t.id===id);
    if (t) Object.assign(t, data);
  } else {
    tasks.push({...data, id: Date.now(), comments: []});
  }
  save(); closeModal(); renderTab("tasks");
}

function deleteTask(id) {
  tasks = tasks.filter(t=>t.id!==id);
  save(); closeModal(); renderTab("tasks");
}

function openDecisionModal(id) {
  const dec = id ? decisions.find(d=>d.id===id) : null;
  const f = dec || {date:new Date().toLocaleDateString("fr-FR"),decision:"",context:"",by:"Rached + Elyssa",status:"closed"};
  document.getElementById("modalContainer").innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-title">${dec?"Modifier la d\u00e9cision":"Logger une d\u00e9cision"}</div>
        <div class="form-field"><label>D\u00e9cision</label><textarea id="dDecision" rows="3">${esc(f.decision)}</textarea></div>
        <div class="form-field"><label>Contexte / Raison</label><input id="dContext" value="${esc(f.context)}"></div>
        <div class="form-row">
          <div><label>Date</label><input id="dDate" value="${esc(f.date)}"></div>
          <div><label>D\u00e9cid\u00e9 par</label><input id="dBy" value="${esc(f.by)}"></div>
        </div>
        <div class="form-field"><label>Statut</label><select id="dStatus">
          <option value="closed" ${f.status==="closed"?"selected":""}>Prise \u2713</option>
          <option value="open" ${f.status==="open"?"selected":""}>En attente</option>
        </select></div>
        <div class="modal-actions">
          ${dec?`<button class="btn btn-danger btn-sm" onclick="deleteDecision(${dec.id})">Supprimer</button>`:""}
          <button class="btn btn-ghost btn-sm" onclick="closeModal()">Annuler</button>
          <button class="btn btn-primary btn-sm" onclick="saveDecision(${dec?dec.id:0})">Enregistrer</button>
        </div>
      </div>
    </div>`;
}

function saveDecision(id) {
  const decision = document.getElementById("dDecision").value;
  if (!decision) return;
  const data = {
    decision, context: document.getElementById("dContext").value,
    date: document.getElementById("dDate").value,
    by: document.getElementById("dBy").value,
    status: document.getElementById("dStatus").value,
  };
  if (id) {
    const d = decisions.find(d=>d.id===id);
    if (d) Object.assign(d, data);
  } else {
    decisions.push({...data, id: Date.now()});
  }
  save(); closeModal(); renderTab("decisions");
}

function deleteDecision(id) {
  decisions = decisions.filter(d=>d.id!==id);
  save(); closeModal(); renderTab("decisions");
}

function openBudgetEntryModal(key) {
  const track = budget[key];
  document.getElementById("modalContainer").innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-title">Nouvelle d\u00e9pense \u2014 ${esc(track.name)}</div>
        <div class="form-field"><label>Description</label><input id="bName"></div>
        <div class="form-row">
          <div><label>Montant (TND)</label><input id="bAmount" type="number"></div>
          <div><label>Date pr\u00e9vue</label><input id="bDate" type="date"></div>
        </div>
        <div class="form-field"><label>Statut</label><select id="bStatus">
          <option value="pr\u00e9vu">Pr\u00e9vu</option><option value="engag\u00e9">Engag\u00e9</option><option value="pay\u00e9">Pay\u00e9</option>
        </select></div>
        <div class="modal-actions">
          <button class="btn btn-ghost btn-sm" onclick="closeModal()">Annuler</button>
          <button class="btn btn-primary btn-sm" onclick="saveBudgetEntry('${key}')">Ajouter</button>
        </div>
      </div>
    </div>`;
}

function saveBudgetEntry(key) {
  const name = document.getElementById("bName").value;
  if (!name) return;
  budget[key].entries.push({
    id: Date.now(), name,
    amount: parseFloat(document.getElementById("bAmount").value) || 0,
    date: document.getElementById("bDate").value,
    status: document.getElementById("bStatus").value,
  });
  save(); closeModal(); renderTab("budget");
}

function updateBudgetEntry(key, eid, field, val) {
  const entry = budget[key].entries.find(e=>e.id===eid);
  if (entry) { entry[field] = field === "amount" ? (parseFloat(val)||0) : val; }
  save(); renderTab("budget");
}

function removeBudgetEntry(key, eid) {
  budget[key].entries = budget[key].entries.filter(e=>e.id!==eid);
  save(); renderTab("budget");
}

// =============================================================================
// SCROLL PROGRESS
// =============================================================================
window.addEventListener("scroll", () => {
  const pct = window.scrollY / Math.max(1, document.body.scrollHeight - window.innerHeight);
  document.getElementById("scrollProgress").style.width = Math.round(pct * 100) + "%";
}, { passive: true });

// =============================================================================
// INIT
// =============================================================================
renderTab("dashboard");
</script>
</body>
</html>
