name: Bug
description: Signaler un comportement incorrect ou inattendu
title: "[BUG] "
labels: ["bug"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Sévérité
      options:
        - Critique (site cassé / réservation impossible)
        - Haute (fonctionnalité principale KO)
        - Moyenne (comportement incorrect, workaround possible)
        - Faible (cosmétique, mineur)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description du bug
      description: Qu'est-ce qui se passe ? Qu'est-ce qui devrait se passer ?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Aller sur /restaurant/reserver
        2. Sélectionner une date
        3. Choisir 4 personnes
        4. Cliquer sur "12:30"
        5. → Erreur 500
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environnement
      multiple: true
      options:
        - Production (domainesidiabdallah.com)
        - Preview Vercel
        - Local (localhost:3000)
        - Mobile — iPhone Safari
        - Mobile — Android Chrome
        - Desktop — Chrome
        - Desktop — Safari
        - Desktop — Firefox

  - type: textarea
    id: context
    attributes:
      label: Contexte supplémentaire
      description: Logs d'erreur, captures d'écran, URL exacte, heure
